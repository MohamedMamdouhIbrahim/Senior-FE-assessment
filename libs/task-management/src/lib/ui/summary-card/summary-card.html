<article
  cdkDrag
  class="summary-card"
  role="button"
  tabindex="0"
  [cdkDragData]="task()"
  [class.overdue-critical]="
    task().status !== 'done' && task().isOverdue && task().priority === 'high'
  "
  (click)="taskClick.emit(task())"
  (keydown.enter)="taskClick.emit(task())"
  (keydown.space)="$event.preventDefault(); taskClick.emit(task())"
>
  <!-- Drag handle -->
  <div aria-label="Drag task" cdkDragHandle class="drag-handle">
    <svg fill="currentColor" height="16" viewBox="0 0 24 24" width="16">
      <path
        d="M11 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm-2-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 4c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"
      />
    </svg>
  </div>

  <!-- Drag placeholder -->
  <div *cdkDragPlaceholder class="drag-placeholder"></div>

  <!-- Drag preview -->
  <div *cdkDragPreview class="drag-preview">
    <span>{{ task().title }}</span>
  </div>

  <!-- Card header -->
  <header class="card-header">
    <task-management-tag [priority]="task().priority" />
  </header>

  <!-- Card title -->
  <h3 class="card-title">{{ task().title }}</h3>

  <!-- Card description -->
  <p class="card-description">{{ task().description }}</p>

  <span
    class="overdue-badge"
    [attr.aria-hidden]="
      task().status === 'done' || !task().isOverdue ? 'true' : null
    "
    [class.overdue-badge--hidden]="
      task().status === 'done' || !task().isOverdue
    "
  >
    @if (task().status !== 'done' && task().isOverdue) { {{ overdueDuration() }}
    }
  </span>

  <!-- Card footer -->
  <footer class="card-footer">
    @if (task().assignee; as assignee) {
    <div class="assignee">
      <task-management-avatar
        aria-hidden="true"
        class="assignee-avatar"
        type="secondary"
        [text]="assignee.name.charAt(0).toUpperCase()"
      />
      <span class="assignee-name">&#64;{{ assignee.name }}</span>
    </div>
    }
    <span
      class="due-date"
      [class.overdue]="task().status !== 'done' && task().isOverdue"
    >
      @if (task().status === 'done') { {{ completedDuration() }} } @else { {{
      task().dueDate }} }
    </span>
  </footer>
</article>
