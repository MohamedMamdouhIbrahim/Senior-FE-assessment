<task-management-ui-task-summary [tasks]="tasks()" />

<task-management-ui-board-toolbar
  [selectedFilter]="selectedFilter()"
  [prioritySort]="prioritySort()"
  (filterSelected)="selectFilter($event)"
  (prioritySortToggled)="togglePrioritySort()"
  (createTaskClicked)="openCreateTask()"
/>

<task-management-ui-kanban-board
  class="board-content"
  [columns]="columns()"
  (taskClicked)="openEditTask($event)"
  (taskDropped)="onTaskDropped($event)"
/>

@if (isCreateTaskOpen()) {
<div class="dialog-backdrop">
  <section
    aria-labelledby="create-task-title"
    aria-modal="true"
    class="dialog-panel"
    role="dialog"
  >
    <task-management-create-task
      [assignees]="assignees()"
      (cancelled)="closeCreateTask()"
      (taskCreated)="onTaskCreated($event)"
    />
  </section>
</div>
} @if (editingTask(); as task) {
<div class="dialog-backdrop">
  <section
    aria-labelledby="edit-task-title"
    aria-modal="true"
    class="dialog-panel"
    role="dialog"
  >
    <task-management-edit-task
      [task]="task"
      [assignees]="assignees()"
      (cancelled)="closeEditTask()"
      (taskUpdated)="onTaskUpdated($event)"
    />
  </section>
</div>
}
