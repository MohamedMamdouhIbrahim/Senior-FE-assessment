<mat-sidenav-container>
  <mat-sidenav
    [class.sidenav-desktop-padding]="!isMobile()"
    [class.sidenav-mobile-padding]="isMobile()"
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    (closedStart)="sidenavOpened.set(false)"
  >
    @if (isMobile()) {
    <div class="mobile-sidenav-header">
      <button
        aria-label="Close navigation"
        mat-icon-button
        type="button"
        (click)="sidenavOpened.set(false)"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path
            d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
          />
        </svg>
      </button>
    </div>
    }
    <mat-nav-list>
      @for (item of navigation; track item.route) {
      <a
        class="navigation-link"
        mat-list-item
        routerLinkActive="active-navigation-link"
        [routerLink]="item.route"
        (click)="isMobile() && sidenavOpened.set(false)"
      >
        <img
          alt=""
          height="24"
          matListItemIcon
          width="24"
          [ngSrc]="'assets/icons/' + item.icon + '.svg'"
        />
        <span matListItemTitle>{{ item.label }}</span>
      </a>
      }
    </mat-nav-list>
    <button
      class="new-task-button"
      color="primary"
      mat-flat-button
      type="button"
      (click)="openCreateTaskDialog()"
    >
      + new task
    </button>
  </mat-sidenav>

  <mat-sidenav-content>
    @if (isMobile()) {
    <div class="mobile-navigation-bar">
      <button
        aria-label="Toggle navigation"
        class="mobile-menu-button"
        mat-icon-button
        type="button"
        (click)="toggleSidenav()"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M3 18h18v-2H3zm0-5h18v-2H3zm0-7v2h18V6z" />
        </svg>
      </button>
    </div>
    } @else {
    <mat-toolbar class="app-toolbar">
      <div class="task-search">
        <label class="visually-hidden" for="task-search-input"
          >Search tasks</label
        >
        <svg aria-hidden="true" class="search-icon" viewBox="0 0 24 24">
          <path
            d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.71.71l.27.28v.78L20 21.49 21.49 20zm-5 0A4.5 4.5 0 1 1 10.5 5a4.5 4.5 0 0 1 0 9"
          />
        </svg>
        <input
          aria-autocomplete="list"
          aria-controls="task-search-results"
          autocomplete="off"
          id="task-search-input"
          placeholder="Search tasks..."
          role="combobox"
          type="search"
          [attr.aria-activedescendant]="
            activeSearchResultIndex() >= 0
              ? 'task-search-result-' + activeSearchResultIndex()
              : null
          "
          [attr.aria-expanded]="isSearchOpen() && searchQuery().trim().length > 0"
          [value]="searchQuery()"
          (blur)="isSearchOpen.set(false)"
          (focus)="isSearchOpen.set(true)"
          (input)="updateSearchQuery($event)"
          (keydown)="handleSearchKeydown($event)"
        />
        @if (isSearchOpen() && searchQuery().trim()) {
        <div
          aria-label="Matching tasks"
          class="search-results"
          id="task-search-results"
          role="listbox"
        >
          @for (task of searchResults(); track task.id; let index = $index) {
          <button
            class="search-result"
            role="option"
            type="button"
            [attr.aria-selected]="activeSearchResultIndex() === index"
            [id]="'task-search-result-' + index"
            (click)="selectSearchResult(task)"
            (mousedown)="$event.preventDefault()"
          >
            <span class="search-result-title">{{ task.title }}</span>
            <span class="search-result-meta"
              >{{ task.status.replace('_', ' ') }}</span
            >
          </button>
          } @empty {
          <p class="search-empty">No tasks found</p>
          }
        </div>
        }
      </div>
      <div class="app-toolbar-actions">
        <button
          aria-label="Notifications"
          class="notification-button"
          mat-icon-button
          type="button"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path
              d="M12 22a2.25 2.25 0 0 0 2.23-2h-4.46A2.25 2.25 0 0 0 12 22m6-6v-5a6 6 0 0 0-5-5.91V4a1 1 0 0 0-2 0v1.09A6 6 0 0 0 6 11v5l-2 2v1h16v-1z"
            />
          </svg>
        </button>
        <span aria-label="User avatar: JJ" class="user-avatar">JJ</span>
      </div>
    </mat-toolbar>
    }
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
