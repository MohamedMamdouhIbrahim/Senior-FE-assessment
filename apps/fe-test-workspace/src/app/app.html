<mat-sidenav-container>
  <mat-sidenav
    [class.sidenav-desktop-padding]="!isMobile()"
    [class.sidenav-mobile-padding]="isMobile()"
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    (closedStart)="sidenavOpened.set(false)"
  >
    @if (isMobile()) {
    <div class="mobile-sidenav-header">
      <button
        aria-label="Close navigation"
        mat-icon-button
        type="button"
        (click)="sidenavOpened.set(false)"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path
            d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
          />
        </svg>
      </button>
    </div>
    }
    <mat-nav-list>
      @for (item of navigation; track item.route) {
      <a
        class="navigation-link"
        mat-list-item
        routerLinkActive="active-navigation-link"
        [routerLink]="item.route"
        (click)="isMobile() && sidenavOpened.set(false)"
      >
        <mat-icon matListItemIcon [svgIcon]="item.icon" />
        <span matListItemTitle>{{ item.label }}</span>
      </a>
      }
    </mat-nav-list>
    <button
      class="new-task-button"
      color="primary"
      mat-flat-button
      type="button"
      (click)="openCreateTaskDialog()"
    >
      + new task
    </button>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar>
      @if (isMobile()) {
      <button mat-icon-button type="button" (click)="toggleSidenav()">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M3 18h18v-2H3zm0-5h18v-2H3zm0-7v2h18V6z" />
        </svg>
      </button>
      }
    </mat-toolbar>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
