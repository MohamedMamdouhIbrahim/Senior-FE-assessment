services:
  app:
    build:
      context: .
    environment:
      NODE_ENV: production
      PORT: 4000
    ports:
      - "${APP_PORT:-4000}:4000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
